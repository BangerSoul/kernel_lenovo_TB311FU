name: Build PoplarKernel for Lenovo Tab M11

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Kernel source Git repository URL:'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      KERNEL_BRANCH:
        description: 'Kernel source branch or tag:'
        required: true
        default: 'android15-6.6-2025-04_r18'
      DEFCONFIG:
        description: 'Target defconfig:'
        required: true
        default: 'gki_defconfig'
      KERNELSU_MODE:
        description: 'Root solution to integrate:'
        required: true
        type: choice
        default: 'KernelSU-Next'
        options:
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'None'
      USE_CUSTOM_CLANG:
        description: 'Use AOSP prebuilt Clang (true) or System LLVM (false):'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      CLANG_REPO:
        description: 'Clang toolchain repository or "aosp" for official clang-r510928:'
        required: false
        default: 'aosp'
      BUILD_DTBO:
        description: 'Build and package DTBO image:'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build PoplarKernel v1.2 for Lenovo Tab M11 (TB311FU)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unused preinstalled packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Setting up 12GB Swap to prevent OOM killer during LTO link ==="
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Check out Pipeline Repository
        uses: actions/checkout@v4
        with:
          path: kernel_pipeline

      - name: Install Build Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 libssl-dev libelf-dev python3 \
            python3-pip rsync lz4 ccache bc cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm

      - name: Set up Clang Toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          if [ "${{ inputs.USE_CUSTOM_CLANG }}" = "true" ]; then
            if [ -n "${{ inputs.CLANG_REPO }}" ] && [ "${{ inputs.CLANG_REPO }}" != "aosp" ] && [[ "${{ inputs.CLANG_REPO }}" != *"clang-r510928"* ]]; then
              echo "Cloning custom Clang toolchain from ${{ inputs.CLANG_REPO }}..."
              git clone --depth=1 "${{ inputs.CLANG_REPO }}" "$GITHUB_WORKSPACE/toolchain/clang"
              echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
            else
              echo "Cloning official AOSP Clang toolchain (clang-r510928) for Android 15 / 6.6..."
              git clone --depth=1 -b android15-release --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$GITHUB_WORKSPACE/toolchain/clang_repo"
              cd "$GITHUB_WORKSPACE/toolchain/clang_repo"
              git sparse-checkout set clang-r510928
              echo "$GITHUB_WORKSPACE/toolchain/clang_repo/clang-r510928/bin" >> $GITHUB_PATH
            fi
          else
            echo "Using system LLVM / Clang..."
          fi

      - name: Clone Kernel Source
        run: |
          echo "Cloning kernel source (${{ inputs.KERNEL_BRANCH }})..."
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.KERNEL_REPO }}" "$GITHUB_WORKSPACE/kernel_src"

      - name: Patch KMI, Module Compatibility & Signature Verification Bypass
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          echo "=== Setting matching KMI localversion ==="
          # Set localversion so UTS_RELEASE produces 6.6.82-android15-8-g076ac12bde16-4k
          echo "-android15-8-g076ac12bde16" > localversion

          echo "=== Patching kernel/module/version.c (Bypass CRC mismatches) ==="
          sed -i '/int check_version(/,/^{/ {
            /^{/ a\	return 1;
          }' kernel/module/version.c

          echo "=== Patching kernel/module/main.c (Bypass vermagic & GKI protected exports) ==="
          sed -i 's/return strcmp(amagic, bmagic) == 0;/return 1;/' kernel/module/main.c
          sed -i 's/is_vendor_module = !mod->sig_ok;/is_vendor_module = 0;/' kernel/module/main.c

          echo "=== Patching kernel/module/signing.c (Bypass module signature checks for system_dlkm & vendor drivers) ==="
          sed -i '/int mod_verify_sig(/,/^{/ {
            /^{/ a\	info->sig_ok = true;\n	return 0;
          }' kernel/module/signing.c

          echo "=== Module patches applied successfully ==="
          git diff kernel/module/ || true

      - name: Integrate KernelSU / KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          MODE="${{ inputs.KERNELSU_MODE }}"

          if [ "$MODE" = "KernelSU-Next" ]; then
            echo "Integrating KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          elif [ "$MODE" = "KernelSU" ]; then
            echo "Integrating Official KernelSU..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          else
            echo "No root solution selected. Compiling vanilla kernel."
          fi

      - name: Configure Target Defconfig
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          DEFCONFIG="${{ inputs.DEFCONFIG }}"

          # Enable kprobes & overlayfs required for KernelSU if enabled
          if [ "${{ inputs.KERNELSU_MODE }}" != "None" ]; then
            echo "CONFIG_KPROBES=y" >> "arch/arm64/configs/${DEFCONFIG}"
            echo "CONFIG_HAVE_KPROBES=y" >> "arch/arm64/configs/${DEFCONFIG}"
            echo "CONFIG_KPROBE_EVENTS=y" >> "arch/arm64/configs/${DEFCONFIG}"
            echo "CONFIG_OVERLAY_FS=y" >> "arch/arm64/configs/${DEFCONFIG}"
          fi

          # Wi-Fi Subsystem Configuration
          # Preserve stock GKI defaults: CONFIG_RFKILL=m, and cfg80211/mac80211 as out-of-tree vendor modules.
          # Module signature & vermagic bypass allows stock system_dlkm rfkill.ko to load cleanly,
          # satisfying modules.dep so modprobe automatically loads cfg80211.ko and wlan_drv_gen4m_6768.ko.
          # Ensure CONFIG_RFKILL=m is explicitly preserved in defconfig
          sed -i 's/CONFIG_RFKILL=y/CONFIG_RFKILL=m/' "arch/arm64/configs/${DEFCONFIG}" || true

          # Enable force module loading
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> "arch/arm64/configs/${DEFCONFIG}"

          # Switch to ThinLTO to reduce memory footprint during LTO linking
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "arch/arm64/configs/${DEFCONFIG}" || true

          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- "$DEFCONFIG"

      - name: Compile PoplarKernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image

          # Compress Image to Image.gz
          if [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -n -k -9 "out/arch/arm64/boot/Image"
          fi

          if [ "${{ inputs.BUILD_DTBO }}" = "true" ]; then
            make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- dtbo.img || true
          fi

      - name: Package Flashable PoplarKernel AnyKernel3 Zip
        id: package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          KSU_TAG="${{ inputs.KERNELSU_MODE }}"

          # Clone standard AnyKernel3 base template
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$GITHUB_WORKSPACE/ak3"
          rm -rf "$GITHUB_WORKSPACE/ak3/.git"

          # Overlay Lenovo TB311FU PoplarKernel anykernel.sh
          cp "$GITHUB_WORKSPACE/kernel_pipeline/anykernel/anykernel.sh" "$GITHUB_WORKSPACE/ak3/anykernel.sh"

          # Copy compiled kernel Images
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz" "$GITHUB_WORKSPACE/ak3/Image.gz"
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz" "$GITHUB_WORKSPACE/artifacts/Image.gz"
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/artifacts/Image"
          fi

          if [ ! -f "$GITHUB_WORKSPACE/artifacts/Image.gz" ]; then
            echo "Error: Compressed kernel Image.gz binary not generated in out directory!"
            exit 1
          fi

          # Copy DTBO if built
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/dtbo.img" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/dtbo.img" "$GITHUB_WORKSPACE/ak3/dtbo.img"
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/dtbo.img" "$GITHUB_WORKSPACE/artifacts/dtbo.img"
          fi

          # Zip AnyKernel3 package
          cd "$GITHUB_WORKSPACE/ak3"
          ZIP_NAME="PoplarKernel-v1.2-TB311FU-${KSU_TAG}-${TIMESTAMP}.zip"
          zip -r9 "$GITHUB_WORKSPACE/artifacts/$ZIP_NAME" * -x .git README.md

          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum * > SHA256SUMS.txt
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          ls -la "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PoplarKernel-TB311FU-${{ steps.package.outputs.TIMESTAMP }}
          path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: (steps.package.outcome == 'success') && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        with:
          tag_name: PoplarKernel-v1.2-${{ steps.package.outputs.TIMESTAMP }}
          name: "PoplarKernel v1.2 with ${{ inputs.KERNELSU_MODE }} for Lenovo Tab M11 (TB311FU)"
          body: |
            # 🌲 PoplarKernel v1.2 for Lenovo Tab M11 (TB311FU)
            **The First Official Custom Kernel for Lenovo Tab M11 (`TB311FU` / `poplar`)!**

            ---

            ### 🚀 Specifications & Features
            - **Developer / Maintainer:** @BangerSoul
            - **Target Device:** Lenovo Tab M11 (`TB311FU` / `poplar`)
            - **SoC:** MediaTek MT8786 / MT6769 (Helio G88)
            - **Linux Kernel Base:** Android 15 GKI Linux `6.6.82` (`android15-6.6-2025-04_r18`)
            - **Root Solution:** Integrated **KernelSU-Next** (Protocol v6, SELinux Enforcing, full superuser authority)
            - **Wi-Fi & Connectivity Fix:** Native modular Wi-Fi subsystem (`CONFIG_RFKILL=m`) with module signature bypass, matching stock `modules.dep` dependency resolution and MediaTek FullMAC vendor driver struct offsets
            - **Full Vendor Module Compatibility:** Module signature bypass and symbol protection bypass for all 102 hardware SoC modules in `vendor_boot`, `system_dlkm`, and `vendor_dlkm`
            - **Toolchain:** Compiled with official Google AOSP Clang 18 (`clang-r510928`) with ThinLTO
            - **Packaging:** Native AnyKernel3 with gzip compression (`Image.gz`), verified to fit perfectly within the 32 MB `boot` partition

            ---

            ### 🎖️ Credits & Acknowledgments
            - **BangerSoul** - Kernel Development, Device Porting, and Build System
            - **Google AOSP Team** - Android Generic Kernel Image (GKI) Linux 6.6
            - **Lenovo & MediaTek** - MT8786 platform trees and hardware SoC vendor drivers
            - **weishu & rifxsd** - KernelSU and KernelSU-Next projects
            - **osm0sis @ XDA** - AnyKernel3 Universal Flash Tool
            - **Andy Yan & PHH** - Treble GSI & LineageOS Community
          draft: false
          prerelease: false
          files: artifacts/*

  # ---------------------------------------------------------------------------
  # R1: Halium Ubuntu Touch Build Job
  # Builds the GKI kernel with halium_tb311fu_defconfig for Ubuntu Touch.
  # Runs in parallel with the existing 'build' job.
  # ---------------------------------------------------------------------------
  build-halium:
    name: Build Halium Kernel for Ubuntu Touch (TB311FU)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      # Halium Ubuntu Touch: AppArmor is used for confinement — no KernelSU hooks.
      KERNELSU_MODE: None
      HALIUM_DEFCONFIG: halium_tb311fu_defconfig

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unused preinstalled packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Setting up 12GB Swap to prevent OOM killer during LTO link ==="
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Check out Pipeline Repository
        uses: actions/checkout@v4
        with:
          path: kernel_pipeline

      - name: Install Build Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 libssl-dev libelf-dev python3 \
            python3-pip rsync lz4 ccache bc cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm

      - name: Set up AOSP Clang r510928 Toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          echo "Cloning official AOSP Clang toolchain (clang-r510928) for Android 15 / 6.6..."
          git clone --depth=1 -b android15-release --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$GITHUB_WORKSPACE/toolchain/clang_repo"
          cd "$GITHUB_WORKSPACE/toolchain/clang_repo"
          git sparse-checkout set clang-r510928
          echo "$GITHUB_WORKSPACE/toolchain/clang_repo/clang-r510928/bin" >> $GITHUB_PATH

      - name: Clone Kernel Source
        run: |
          echo "Cloning kernel source (${{ inputs.KERNEL_BRANCH }}) for Halium build..."
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.KERNEL_REPO }}" \
            "$GITHUB_WORKSPACE/kernel_src_halium"

      - name: Install Halium Defconfig into Kernel Source Tree
        run: |
          # Copy the authoritative halium_tb311fu_defconfig from the pipeline repo
          # into the kernel source arch/arm64/configs/ directory.
          DEFCONFIG_DEST="$GITHUB_WORKSPACE/kernel_src_halium/arch/arm64/configs/${HALIUM_DEFCONFIG}"

          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/halium_tb311fu_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/kernel_pipeline/halium_tb311fu_defconfig" "$DEFCONFIG_DEST"
            echo "Installed halium_tb311fu_defconfig -> arch/arm64/configs/${HALIUM_DEFCONFIG}"
          elif [ -f "$GITHUB_WORKSPACE/kernel_pipeline/tb311fu_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/kernel_pipeline/tb311fu_defconfig" "$DEFCONFIG_DEST"
            echo "Installed tb311fu_defconfig -> arch/arm64/configs/${HALIUM_DEFCONFIG}"
          else
            echo "ERROR: halium_tb311fu_defconfig not found in pipeline repository!"
            exit 1
          fi

      - name: Patch KMI, Module Compatibility & Signature Verification Bypass
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src_halium"
          echo "=== Setting matching KMI localversion ==="
          echo "-android15-8-g076ac12bde16" > localversion

          echo "=== Patching kernel/module/version.c (Bypass CRC mismatches) ==="
          sed -i '/int check_version(/,/^{/ {
            /^{/ a\\treturn 1;
          }' kernel/module/version.c

          echo "=== Patching kernel/module/main.c (Bypass vermagic & GKI protected exports) ==="
          sed -i 's/return strcmp(amagic, bmagic) == 0;/return 1;/' kernel/module/main.c
          sed -i 's/is_vendor_module = !mod->sig_ok;/is_vendor_module = 0;/' kernel/module/main.c

          echo "=== Patching kernel/module/signing.c (Bypass module signature checks) ==="
          sed -i '/int mod_verify_sig(/,/^{/ {
            /^{/ a\\tinfo->sig_ok = true;\n\treturn 0;
          }' kernel/module/signing.c

          echo "=== Module patches applied ==="
          git diff kernel/module/ || true

      - name: Configure Halium Defconfig (KernelSU=None, ThinLTO, RFKILL=m enforced)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src_halium"

          # Halium Ubuntu Touch: NO KernelSU integration (AppArmor confinement is used instead)
          echo "KernelSU disabled for Halium Ubuntu Touch build — AppArmor enforced."

          # Enforce CONFIG_RFKILL=m (stock modules.dep compatibility)
          sed -i 's/CONFIG_RFKILL=y/CONFIG_RFKILL=m/' "arch/arm64/configs/${HALIUM_DEFCONFIG}" || true

          # Switch to ThinLTO to reduce memory footprint during LTO linking
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "arch/arm64/configs/${HALIUM_DEFCONFIG}" || true

          # Force module loading compatibility
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"

          # Explicitly assert AppArmor is enabled (non-negotiable for Ubuntu Touch)
          grep -q "CONFIG_SECURITY_APPARMOR=y" "arch/arm64/configs/${HALIUM_DEFCONFIG}" || \
            echo "CONFIG_SECURITY_APPARMOR=y" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"
          grep -q "CONFIG_DEFAULT_SECURITY_APPARMOR=y" "arch/arm64/configs/${HALIUM_DEFCONFIG}" || \
            echo "CONFIG_DEFAULT_SECURITY_APPARMOR=y" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"

          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            "${HALIUM_DEFCONFIG}"

          # Post-configure verification: assert critical configs in .config
          echo "=== Post-configure .config assertions ==="
          grep "CONFIG_SECURITY_APPARMOR=y" out/.config || \
            { echo "FATAL: CONFIG_SECURITY_APPARMOR=y missing from .config!"; exit 1; }
          grep "CONFIG_RFKILL=m" out/.config || \
            { echo "FATAL: CONFIG_RFKILL=m missing from .config!"; exit 1; }
          echo "CONFIG assertions passed: AppArmor=y, RFKILL=m"

      - name: Compile Halium Kernel (Image + Image.gz + DTBO)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src_halium"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image

          # Compress Image -> Image.gz for Boot Header v4 packaging
          if [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -n -k -9 "out/arch/arm64/boot/Image"
            echo "Image.gz compressed successfully."
          else
            echo "ERROR: Kernel Image not produced!"
            exit 1
          fi

          # Build DTBO overlay image if applicable
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            dtbo.img 2>/dev/null || echo "[INFO] No dtbo.img target — skipping."

      - name: Collect Halium Kernel Artifacts
        id: halium_package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/halium-artifacts"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          # Required: Image.gz
          cp "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/Image.gz" \
             "$GITHUB_WORKSPACE/halium-artifacts/Image.gz"

          # Required: System.map for symbol debugging
          cp "$GITHUB_WORKSPACE/kernel_src_halium/out/System.map" \
             "$GITHUB_WORKSPACE/halium-artifacts/System.map" 2>/dev/null || \
          cp "$GITHUB_WORKSPACE/kernel_src_halium/System.map" \
             "$GITHUB_WORKSPACE/halium-artifacts/System.map" 2>/dev/null || \
            echo "[WARN] System.map not found — skipping."

          # Optional: dtbo.img
          if [ -f "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/dtbo.img" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/dtbo.img" \
               "$GITHUB_WORKSPACE/halium-artifacts/dtbo.img"
            echo "dtbo.img included."
          fi

          # Audit: .config for transparency & reproducibility
          cp "$GITHUB_WORKSPACE/kernel_src_halium/out/.config" \
             "$GITHUB_WORKSPACE/halium-artifacts/halium_tb311fu.config"

          # Final .config assertions before release
          grep "CONFIG_SECURITY_APPARMOR=y" "$GITHUB_WORKSPACE/halium-artifacts/halium_tb311fu.config" || \
            { echo "FATAL: CONFIG_SECURITY_APPARMOR=y absent from released .config!"; exit 1; }
          grep "CONFIG_RFKILL=m" "$GITHUB_WORKSPACE/halium-artifacts/halium_tb311fu.config" || \
            { echo "FATAL: CONFIG_RFKILL=m absent from released .config!"; exit 1; }

          cd "$GITHUB_WORKSPACE/halium-artifacts"
          sha256sum * > SHA256SUMS.txt
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          ls -la

      - name: Upload Halium Kernel Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: halium-kernel-artifacts-${{ steps.halium_package.outputs.TIMESTAMP }}
          path: halium-artifacts/*

      - name: Create Halium Kernel GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.halium_package.outcome == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        with:
          tag_name: halium-kernel-${{ steps.halium_package.outputs.TIMESTAMP }}
          name: "Halium Kernel for Ubuntu Touch — Lenovo Tab M11 (TB311FU) [${{ steps.halium_package.outputs.TIMESTAMP }}]"
          body: |
            # 🐧 Halium Ubuntu Touch Kernel for Lenovo Tab M11 (TB311FU)

            GKI Linux 6.6 kernel built with `halium_tb311fu_defconfig` for Ubuntu Touch / UBports deployment.

            ---

            ### Artifacts
            | File | Description |
            |------|-------------|
            | `Image.gz` | Compressed kernel — use with `package_halium_boot.py` to build `halium-boot.img` |
            | `System.map` | Kernel symbol map for crash debugging |
            | `dtbo.img` | Device Tree Blob Overlay (if produced) |
            | `halium_tb311fu.config` | Full kernel `.config` for audit and reproducibility |
