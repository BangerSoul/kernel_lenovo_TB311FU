name: Build PoplarKernel for Lenovo Tab with Clear Case (TB311FU)

on:
  push:
    tags:
      - 'v*'
      - 'PoplarKernel-*'
      - 'halium-kernel-*'
      - 'kernel-*'
      - 'perf-*'
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Kernel source Git repository URL:'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      KERNEL_BRANCH:
        description: 'Kernel source branch or tag:'
        required: true
        default: 'android15-6.6-2025-04_r18'
      DEFCONFIG:
        description: 'Target defconfig:'
        required: true
        default: 'tb311fu_defconfig'
      KERNELSU_MODE:
        description: 'Root solution to integrate:'
        required: true
        type: choice
        default: 'KernelSU-Next'
        options:
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'None'
      LLVM_VERSION:
        description: 'Upstream LLVM toolchain version pinned date:'
        required: true
        default: '20261118'
      BUILD_DTBO:
        description: 'Build and package DTBO image:'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build PoplarKernel for Lenovo Tab with Clear Case (TB311FU)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unused preinstalled packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Setting up 12GB Swap to prevent OOM killer during LTO link ==="
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Check out Pipeline Repository
        uses: actions/checkout@v4
        with:
          path: kernel_pipeline

      - name: Install Build Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 libssl-dev libelf-dev python3 \
            python3-pip rsync lz4 ccache bc cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm device-tree-compiler

      - name: Set up Upstream LLVM Toolchain (Pinned to 20261118)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          LLVM_PINNED_TAG="${{ inputs.LLVM_VERSION || '20261118' }}"
          echo "Setting up latest upstream LLVM toolchain pinned to ${LLVM_PINNED_TAG}..."

          # Fetch and install latest upstream LLVM toolchain
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18 || true

          # Create symlinks for unversioned binaries if versioned tools installed
          for tool in clang clang++ ld.lld llvm-objdump llvm-ar llvm-nm llvm-strip llvm-readelf; do
            if command -v "${tool}-18" >/dev/null 2>&1; then
              sudo ln -sf "$(which ${tool}-18)" "/usr/local/bin/${tool}"
            fi
          done

          echo "=== Pinned LLVM Toolchain Active ==="
          which clang && clang --version
          which ld.lld && ld.lld --version

      - name: Clone Kernel Source
        run: |
          BRANCH="${{ inputs.KERNEL_BRANCH || 'android15-6.6-2025-04_r18' }}"
          REPO="${{ inputs.KERNEL_REPO || 'https://android.googlesource.com/kernel/common' }}"
          echo "Cloning kernel source (${BRANCH}) from ${REPO}..."
          git clone --depth=1 -b "$BRANCH" "$REPO" "$GITHUB_WORKSPACE/kernel_src"

      - name: Patch KMI, Module Compatibility & Signature Verification Bypass
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          echo "=== Setting matching KMI localversion ==="
          # Set localversion so UTS_RELEASE produces 6.6.82-android15-8-g076ac12bde16-4k
          echo "-android15-8-g076ac12bde16" > localversion

          echo "=== Patching kernel/module/version.c (Bypass CRC mismatches) ==="
          sed -i '/int check_version(/,/^{/ {
            /^{/ a\	return 1;
          }' kernel/module/version.c

          echo "=== Patching kernel/module/main.c (Bypass vermagic & GKI protected exports) ==="
          sed -i 's/return strcmp(amagic, bmagic) == 0;/return 1;/' kernel/module/main.c
          sed -i 's/is_vendor_module = !mod->sig_ok;/is_vendor_module = 0;/' kernel/module/main.c

          echo "=== Patching kernel/module/signing.c (Bypass module signature checks for system_dlkm & vendor drivers) ==="
          sed -i '/int mod_verify_sig(/,/^{/ {
            /^{/ a\	info->sig_ok = true;\n	return 0;
          }' kernel/module/signing.c

          echo "=== Module patches applied successfully ==="
          git diff kernel/module/ || true

          echo "=== Patching drivers/video/backlight/ (Enforce floor raw PWM >= 48) ==="
          python3 -c '
          with open("drivers/video/backlight/backlight.c", "r") as f:
              c = f.read()
          if "brightness < 48" not in c:
              c = c.replace("int rc = -ENXIO;", "if (brightness > 0 && brightness < 48) brightness = 48;\n\tint rc = -ENXIO;", 1)
              with open("drivers/video/backlight/backlight.c", "w") as f:
                  f.write(c)
          with open("drivers/video/backlight/pwm_bl.c", "r") as f:
              p = f.read()
          if "brightness < 48" not in p:
              p = p.replace("int brightness = backlight_get_effective_brightness(bd);", "int brightness = backlight_get_effective_brightness(bd);\n\tif (brightness > 0 && brightness < 48) brightness = 48;", 1)
              with open("drivers/video/backlight/pwm_bl.c", "w") as f:
                  f.write(p)
          '
          echo "=== Backlight driver patches applied successfully ==="
          git diff drivers/video/backlight/ || true

          echo "=== Patching drivers/md/dm-verity-target.c (Permissive dm-verity for repacked vendor & GSI) ==="
          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/patches/0002-permissive-dm-verity.patch" ]; then
            git apply "$GITHUB_WORKSPACE/kernel_pipeline/patches/0002-permissive-dm-verity.patch" || {
              echo "Git apply failed, falling back to direct sed patching..."
              sed -i '/static int verity_handle_err(/,/^{/ {
                /^{/ a\	pr_warn_ratelimited("%s: dm-verity corruption at block %llu ignored (permissive mode)\\n", v->data_dev->name, block);\n	return 0;
              }' drivers/md/dm-verity-target.c
            }
          else
            sed -i '/static int verity_handle_err(/,/^{/ {
              /^{/ a\	pr_warn_ratelimited("%s: dm-verity corruption at block %llu ignored (permissive mode)\\n", v->data_dev->name, block);\n	return 0;
            }' drivers/md/dm-verity-target.c
          fi
          echo "=== Permissive dm-verity patch applied successfully ==="
          git diff drivers/md/ || true

          echo "=== Patching fs/notify (Increase default inotify and fanotify limits) ==="
          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/patches/0003-increase-inotify-fanotify-limits.patch" ]; then
            git apply "$GITHUB_WORKSPACE/kernel_pipeline/patches/0003-increase-inotify-fanotify-limits.patch" || {
              echo "Git apply failed, applying sed modifications..."
              sed -i 's/#define INOTIFY_SYSCTL_MAX_USER_WATCHES\t8192/#define INOTIFY_SYSCTL_MAX_USER_WATCHES\t1048576/' fs/notify/inotify/inotify_user.c
              sed -i 's/#define INOTIFY_SYSCTL_MAX_USER_INSTANCES\t128/#define INOTIFY_SYSCTL_MAX_USER_INSTANCES\t1024/' fs/notify/inotify/inotify_user.c
              sed -i 's/#define INOTIFY_SYSCTL_MAX_QUEUED_EVENTS\t16384/#define INOTIFY_SYSCTL_MAX_QUEUED_EVENTS\t32768/' fs/notify/inotify/inotify_user.c
              sed -i 's/#define FANOTIFY_DEFAULT_MAX_EVENTS\t16384/#define FANOTIFY_DEFAULT_MAX_EVENTS\t32768/' fs/notify/fanotify/fanotify_user.c
              sed -i 's/#define FANOTIFY_DEFAULT_MAX_MARKS\t8192/#define FANOTIFY_DEFAULT_MAX_MARKS\t65536/' fs/notify/fanotify/fanotify_user.c
              sed -i 's/#define FANOTIFY_DEFAULT_MAX_LISTENERS\t128/#define FANOTIFY_DEFAULT_MAX_LISTENERS\t1024/' fs/notify/fanotify/fanotify_user.c
            }
          fi
          echo "=== inotify / fanotify limits increased successfully ==="
          git diff fs/notify/ || true

      - name: Integrate KernelSU / KernelSU-Next
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          MODE="${{ inputs.KERNELSU_MODE || 'KernelSU-Next' }}"

          if [ "$MODE" = "KernelSU-Next" ]; then
            echo "Integrating KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          elif [ "$MODE" = "KernelSU" ]; then
            echo "Integrating Official KernelSU..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          else
            echo "No root solution selected. Compiling vanilla kernel."
          fi

      - name: Install & Configure Target Defconfig
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          DEFCONFIG="${{ inputs.DEFCONFIG || 'tb311fu_defconfig' }}"

          # Copy tuned tb311fu_defconfig from pipeline repository into kernel source tree
          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/tb311fu_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/kernel_pipeline/tb311fu_defconfig" "arch/arm64/configs/${DEFCONFIG}"
            echo "Installed pipeline defconfig -> arch/arm64/configs/${DEFCONFIG}"
          fi

          # Enable kprobes & overlayfs required for KernelSU if enabled
          if [ "${{ inputs.KERNELSU_MODE || 'KernelSU-Next' }}" != "None" ]; then
            echo "CONFIG_KPROBES=y" >> "arch/arm64/configs/${DEFCONFIG}"
            echo "CONFIG_HAVE_KPROBES=y" >> "arch/arm64/configs/${DEFCONFIG}"
            echo "CONFIG_KPROBE_EVENTS=y" >> "arch/arm64/configs/${DEFCONFIG}"
            echo "CONFIG_OVERLAY_FS=y" >> "arch/arm64/configs/${DEFCONFIG}"
          fi

          # Wi-Fi Subsystem Configuration
          # Preserve stock GKI defaults: CONFIG_RFKILL=m, and cfg80211/mac80211 as out-of-tree vendor modules.
          # Ensure CONFIG_RFKILL=m is explicitly preserved in defconfig
          sed -i 's/CONFIG_RFKILL=y/CONFIG_RFKILL=m/' "arch/arm64/configs/${DEFCONFIG}" || true

          # Enable force module loading
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> "arch/arm64/configs/${DEFCONFIG}"

          # Switch to ThinLTO to reduce memory footprint during LTO linking
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "arch/arm64/configs/${DEFCONFIG}" || true

          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- "$DEFCONFIG"

      - name: Compile PoplarKernel (Image + Image.gz-dtb + dtbo.img)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src"
          echo "=== Compiling Kernel Image & DTBs with LLVM (20261118) ==="
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image dtbs || true

          # Compress Image to Image.gz
          if [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -n -k -9 "out/arch/arm64/boot/Image"
            echo "Kernel Image compressed to Image.gz."
          fi

          # Build Image.gz-dtb
          echo "=== Generating Image.gz-dtb ==="
          if make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image.gz-dtb 2>/dev/null; then
            echo "Image.gz-dtb produced by kernel target."
          else
            echo "Building Image.gz-dtb from Image.gz + appended DTBs..."
            DTBS=$(find out/arch/arm64/boot/dts/ -name "*.dtb" 2>/dev/null)
            if [ -n "$DTBS" ]; then
              cat out/arch/arm64/boot/Image.gz $DTBS > out/arch/arm64/boot/Image.gz-dtb
            else
              cp out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
            fi
          fi

          # Build DTBO image
          if [ "${{ inputs.BUILD_DTBO || 'true' }}" = "true" ]; then
            echo "=== Building dtbo.img ==="
            make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- dtbo.img 2>/dev/null || {
              echo "Assembling dtbo.img from generated dtbo overlays..."
              DTBOS=$(find out/arch/arm64/boot/dts/ -name "*.dtbo" 2>/dev/null)
              if [ -n "$DTBOS" ]; then
                if [ -f "scripts/ufdt/mkdtboimg.py" ]; then
                  python3 scripts/ufdt/mkdtboimg.py create out/arch/arm64/boot/dtbo.img $DTBOS
                elif command -v mkdtboimg >/dev/null 2>&1; then
                  mkdtboimg create out/arch/arm64/boot/dtbo.img $DTBOS
                fi
              fi
            }
          fi

      - name: Package Flashable PoplarKernel AnyKernel3 Zip
        id: package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          KSU_TAG="${{ inputs.KERNELSU_MODE || 'KernelSU-Next' }}"

          # Clone standard AnyKernel3 base template
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$GITHUB_WORKSPACE/ak3"
          rm -rf "$GITHUB_WORKSPACE/ak3/.git"

          # Overlay Lenovo TB311FU PoplarKernel anykernel.sh
          cp "$GITHUB_WORKSPACE/kernel_pipeline/anykernel/anykernel.sh" "$GITHUB_WORKSPACE/ak3/anykernel.sh"

          # Copy compiled kernel Images into AnyKernel3 and artifacts directory
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz-dtb" "$GITHUB_WORKSPACE/ak3/Image.gz-dtb"
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz-dtb" "$GITHUB_WORKSPACE/artifacts/Image.gz-dtb"
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz" "$GITHUB_WORKSPACE/ak3/Image.gz"
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image.gz" "$GITHUB_WORKSPACE/artifacts/Image.gz"
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/artifacts/Image"
          fi

          if [ ! -f "$GITHUB_WORKSPACE/artifacts/Image.gz" ] && [ ! -f "$GITHUB_WORKSPACE/artifacts/Image.gz-dtb" ]; then
            echo "Error: Neither Image.gz nor Image.gz-dtb binary generated in out directory!"
            exit 1
          fi

          # Copy DTBO if built
          if [ -f "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/dtbo.img" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/dtbo.img" "$GITHUB_WORKSPACE/ak3/dtbo.img"
            cp "$GITHUB_WORKSPACE/kernel_src/out/arch/arm64/boot/dtbo.img" "$GITHUB_WORKSPACE/artifacts/dtbo.img"
          fi

          # Zip AnyKernel3 package
          cd "$GITHUB_WORKSPACE/ak3"
          ZIP_NAME="PoplarKernel-v1.2-TB311FU-${KSU_TAG}-${TIMESTAMP}.zip"
          zip -r9 "$GITHUB_WORKSPACE/artifacts/$ZIP_NAME" * -x .git README.md

          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum * > SHA256SUMS.txt
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          ls -la "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PoplarKernel-TB311FU-${{ steps.package.outputs.TIMESTAMP }}
          path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: (steps.package.outcome == 'success') && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('PoplarKernel-v1.2-{0}', steps.package.outputs.TIMESTAMP) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('PoplarKernel Release {0}', github.ref_name) || format('PoplarKernel v1.2 with {0} for Lenovo Tab with Clear Case (TB311FU)', inputs.KERNELSU_MODE || 'KernelSU-Next') }}
          body: |
            # 🌲 PoplarKernel for Lenovo Tab with Clear Case (TB311FU)
            **High-Performance Downstream Linux 6.6 Kernel for Lenovo Tab with Clear Case (`TB311FU` / `poplar`)!**

            ---

            ### 🚀 Specifications & Features
            - **Developer / Maintainer:** @BangerSoul
            - **Target Device:** Lenovo Tab with Clear Case (`TB311FU` / `poplar`)
            - **SoC:** MediaTek MT8786 / MT6769 (Helio G88)
            - **Linux Kernel Base:** Android 15 GKI Linux `6.6.82` (`android15-6.6-2025-04_r18`)
            - **Root Solution:** Integrated **KernelSU-Next** (SELinux Enforcing, full superuser authority)
            - **Wi-Fi & Connectivity Fix:** Native modular Wi-Fi subsystem (`CONFIG_RFKILL=m`) with module signature bypass
            - **Tuned Performance:**
              - CPU Governor: schedutil default, Energy Model, CPUFreq DT / MTK scaling
              - I/O Scheduler: mq-deadline default, BFQ, Kyber
              - TCP: BBR congestion control default, FQ, FQ-CoDel
              - Memory/zRAM: zRAM with LZ4 compression, zsmalloc, zswap
              - Filesystems: F2FS with compression, exFAT, NTFS3 read/write
              - Limits & Debug: inotify/fanotify limits increased, debug symbols / KASAN stripped
            - **Toolchain:** Compiled with upstream LLVM toolchain (pinned 20261118) and ThinLTO
            - **Packaging:** Native AnyKernel3 with `Image.gz`, `Image.gz-dtb`, and `dtbo.img`
          draft: false
          prerelease: false
          files: artifacts/*

  # ---------------------------------------------------------------------------
  # R1: Halium Ubuntu Touch Build Job
  # Builds the GKI kernel with halium_tb311fu_defconfig for Ubuntu Touch.
  # Runs in parallel with the existing 'build' job.
  # ---------------------------------------------------------------------------
  build-halium:
    name: Build Halium Kernel for Ubuntu Touch (TB311FU)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      # Halium Ubuntu Touch: AppArmor is used for confinement — no KernelSU hooks.
      KERNELSU_MODE: None
      HALIUM_DEFCONFIG: halium_tb311fu_defconfig

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unused preinstalled packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== Setting up 12GB Swap to prevent OOM killer during LTO link ==="
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Check out Pipeline Repository
        uses: actions/checkout@v4
        with:
          path: kernel_pipeline

      - name: Install Build Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 libssl-dev libelf-dev python3 \
            python3-pip rsync lz4 ccache bc cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm device-tree-compiler

      - name: Set up Upstream LLVM Toolchain (Pinned to 20261118)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          LLVM_PINNED_TAG="${{ inputs.LLVM_VERSION || '20261118' }}"
          echo "Setting up latest upstream LLVM toolchain pinned to ${LLVM_PINNED_TAG}..."

          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18 || true

          for tool in clang clang++ ld.lld llvm-objdump llvm-ar llvm-nm llvm-strip llvm-readelf; do
            if command -v "${tool}-18" >/dev/null 2>&1; then
              sudo ln -sf "$(which ${tool}-18)" "/usr/local/bin/${tool}"
            fi
          done

          echo "=== Pinned LLVM Toolchain Active ==="
          which clang && clang --version
          which ld.lld && ld.lld --version

      - name: Clone Kernel Source
        run: |
          BRANCH="${{ inputs.KERNEL_BRANCH || 'android15-6.6-2025-04_r18' }}"
          REPO="${{ inputs.KERNEL_REPO || 'https://android.googlesource.com/kernel/common' }}"
          echo "Cloning kernel source (${BRANCH}) for Halium build..."
          git clone --depth=1 -b "$BRANCH" "$REPO" "$GITHUB_WORKSPACE/kernel_src_halium"

      - name: Install Halium Defconfig into Kernel Source Tree
        run: |
          DEFCONFIG_DEST="$GITHUB_WORKSPACE/kernel_src_halium/arch/arm64/configs/${HALIUM_DEFCONFIG}"

          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/halium_tb311fu_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/kernel_pipeline/halium_tb311fu_defconfig" "$DEFCONFIG_DEST"
            echo "Installed halium_tb311fu_defconfig -> arch/arm64/configs/${HALIUM_DEFCONFIG}"
          elif [ -f "$GITHUB_WORKSPACE/kernel_pipeline/tb311fu_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/kernel_pipeline/tb311fu_defconfig" "$DEFCONFIG_DEST"
            echo "Installed tb311fu_defconfig -> arch/arm64/configs/${HALIUM_DEFCONFIG}"
          else
            echo "ERROR: halium_tb311fu_defconfig not found in pipeline repository!"
            exit 1
          fi

      - name: Patch KMI, Module Compatibility & Signature Verification Bypass
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src_halium"
          echo "=== Setting matching KMI localversion ==="
          echo "-android15-8-g076ac12bde16" > localversion

          echo "=== Patching kernel/module/version.c (Bypass CRC mismatches) ==="
          sed -i '/int check_version(/,/^{/ {
            /^{/ a\\treturn 1;
          }' kernel/module/version.c

          echo "=== Patching kernel/module/main.c (Bypass vermagic & GKI protected exports) ==="
          sed -i 's/return strcmp(amagic, bmagic) == 0;/return 1;/' kernel/module/main.c
          sed -i 's/is_vendor_module = !mod->sig_ok;/is_vendor_module = 0;/' kernel/module/main.c

          echo "=== Patching kernel/module/signing.c (Bypass module signature checks) ==="
          sed -i '/int mod_verify_sig(/,/^{/ {
            /^{/ a\\tinfo->sig_ok = true;\n\treturn 0;
          }' kernel/module/signing.c

          echo "=== Module patches applied ==="
          git diff kernel/module/ || true

          echo "=== Patching drivers/video/backlight/ (Enforce floor raw PWM >= 48) ==="
          python3 -c '
          with open("drivers/video/backlight/backlight.c", "r") as f:
              c = f.read()
          if "brightness < 48" not in c:
              c = c.replace("int rc = -ENXIO;", "if (brightness > 0 && brightness < 48) brightness = 48;\n\tint rc = -ENXIO;", 1)
              with open("drivers/video/backlight/backlight.c", "w") as f:
                  f.write(c)
          with open("drivers/video/backlight/pwm_bl.c", "r") as f:
              p = f.read()
          if "brightness < 48" not in p:
              p = p.replace("int brightness = backlight_get_effective_brightness(bd);", "int brightness = backlight_get_effective_brightness(bd);\n\tif (brightness > 0 && brightness < 48) brightness = 48;", 1)
              with open("drivers/video/backlight/pwm_bl.c", "w") as f:
                  f.write(p)
          '
          echo "=== Backlight driver patches applied successfully ==="
          git diff drivers/video/backlight/ || true

          echo "=== Patching drivers/md/dm-verity-target.c (Permissive dm-verity for repacked vendor & GSI) ==="
          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/patches/0002-permissive-dm-verity.patch" ]; then
            git apply "$GITHUB_WORKSPACE/kernel_pipeline/patches/0002-permissive-dm-verity.patch" || {
              echo "Git apply failed, falling back to direct sed patching..."
              sed -i '/static int verity_handle_err(/,/^{/ {
                /^{/ a\	pr_warn_ratelimited("%s: dm-verity corruption at block %llu ignored (permissive mode)\\n", v->data_dev->name, block);\n	return 0;
              }' drivers/md/dm-verity-target.c
            }
          else
            sed -i '/static int verity_handle_err(/,/^{/ {
              /^{/ a\	pr_warn_ratelimited("%s: dm-verity corruption at block %llu ignored (permissive mode)\\n", v->data_dev->name, block);\n	return 0;
            }' drivers/md/dm-verity-target.c
          fi
          echo "=== Permissive dm-verity patch applied successfully ==="
          git diff drivers/md/ || true

          echo "=== Patching fs/notify (Increase default inotify and fanotify limits) ==="
          if [ -f "$GITHUB_WORKSPACE/kernel_pipeline/patches/0003-increase-inotify-fanotify-limits.patch" ]; then
            git apply "$GITHUB_WORKSPACE/kernel_pipeline/patches/0003-increase-inotify-fanotify-limits.patch" || {
              echo "Git apply failed, applying sed modifications..."
              sed -i 's/#define INOTIFY_SYSCTL_MAX_USER_WATCHES\t8192/#define INOTIFY_SYSCTL_MAX_USER_WATCHES\t1048576/' fs/notify/inotify/inotify_user.c
              sed -i 's/#define INOTIFY_SYSCTL_MAX_USER_INSTANCES\t128/#define INOTIFY_SYSCTL_MAX_USER_INSTANCES\t1024/' fs/notify/inotify/inotify_user.c
              sed -i 's/#define INOTIFY_SYSCTL_MAX_QUEUED_EVENTS\t16384/#define INOTIFY_SYSCTL_MAX_QUEUED_EVENTS\t32768/' fs/notify/inotify/inotify_user.c
              sed -i 's/#define FANOTIFY_DEFAULT_MAX_EVENTS\t16384/#define FANOTIFY_DEFAULT_MAX_EVENTS\t32768/' fs/notify/fanotify/fanotify_user.c
              sed -i 's/#define FANOTIFY_DEFAULT_MAX_MARKS\t8192/#define FANOTIFY_DEFAULT_MAX_MARKS\t65536/' fs/notify/fanotify/fanotify_user.c
              sed -i 's/#define FANOTIFY_DEFAULT_MAX_LISTENERS\t128/#define FANOTIFY_DEFAULT_MAX_LISTENERS\t1024/' fs/notify/fanotify/fanotify_user.c
            }
          fi
          echo "=== inotify / fanotify limits increased successfully ==="
          git diff fs/notify/ || true

      - name: Configure Halium Defconfig (KernelSU=None, ThinLTO, RFKILL=m enforced)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src_halium"

          # Halium Ubuntu Touch: NO KernelSU integration (AppArmor confinement is used instead)
          echo "KernelSU disabled for Halium Ubuntu Touch build — AppArmor enforced."

          # Enforce CONFIG_RFKILL=m (stock modules.dep compatibility)
          sed -i 's/CONFIG_RFKILL=y/CONFIG_RFKILL=m/' "arch/arm64/configs/${HALIUM_DEFCONFIG}" || true

          # Switch to ThinLTO to reduce memory footprint during LTO linking
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "arch/arm64/configs/${HALIUM_DEFCONFIG}" || true

          # Force module loading compatibility
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"

          grep -q "CONFIG_SECURITY_APPARMOR=y" "arch/arm64/configs/${HALIUM_DEFCONFIG}" || \
            echo "CONFIG_SECURITY_APPARMOR=y" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"
          grep -q "CONFIG_DEFAULT_SECURITY_APPARMOR=y" "arch/arm64/configs/${HALIUM_DEFCONFIG}" || \
            echo "CONFIG_DEFAULT_SECURITY_APPARMOR=y" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"
          # Disable symbol trimming
          sed -i '/CONFIG_TRIM_UNUSED_KSYMS/d' "arch/arm64/configs/${HALIUM_DEFCONFIG}" || true
          sed -i '/CONFIG_UNUSED_KSYMS_WHITELIST/d' "arch/arm64/configs/${HALIUM_DEFCONFIG}" || true
          echo "# CONFIG_TRIM_UNUSED_KSYMS is not set" >> "arch/arm64/configs/${HALIUM_DEFCONFIG}"
          touch abi_symbollist.raw || true

          mkdir -p out
          touch out/abi_symbollist.raw || true
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            "${HALIUM_DEFCONFIG}"

          # Post-configure verification: assert critical configs in .config
          echo "=== Post-configure .config assertions ==="
          grep "CONFIG_SECURITY_APPARMOR=y" out/.config || \
            { echo "FATAL: CONFIG_SECURITY_APPARMOR=y missing from .config!"; exit 1; }
          grep "CONFIG_RFKILL=m" out/.config || \
            { echo "FATAL: CONFIG_RFKILL=m missing from .config!"; exit 1; }
          echo "CONFIG assertions passed: AppArmor=y, RFKILL=m"

      - name: Compile Halium Kernel (Image + Image.gz-dtb + dtbo.img)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_src_halium"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image dtbs || true

          # Compress Image -> Image.gz for Boot Header v4 packaging
          if [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -n -k -9 "out/arch/arm64/boot/Image"
            echo "Image.gz compressed successfully."
          else
            echo "ERROR: Kernel Image not produced!"
            exit 1
          fi

          # Build Image.gz-dtb
          if make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image.gz-dtb 2>/dev/null; then
            echo "Image.gz-dtb produced."
          else
            DTBS=$(find out/arch/arm64/boot/dts/ -name "*.dtb" 2>/dev/null)
            if [ -n "$DTBS" ]; then
              cat out/arch/arm64/boot/Image.gz $DTBS > out/arch/arm64/boot/Image.gz-dtb
            else
              cp out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
            fi
          fi

          # Build DTBO overlay image if applicable
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            dtbo.img 2>/dev/null || echo "[INFO] No dtbo.img target — skipping."

      - name: Collect Halium Kernel Artifacts
        id: halium_package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/halium-artifacts"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          # Required: Image.gz & Image.gz-dtb
          cp "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/Image.gz" \
             "$GITHUB_WORKSPACE/halium-artifacts/Image.gz"

          if [ -f "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/Image.gz-dtb" \
               "$GITHUB_WORKSPACE/halium-artifacts/Image.gz-dtb"
          fi

          # Required: System.map for symbol debugging
          cp "$GITHUB_WORKSPACE/kernel_src_halium/out/System.map" \
             "$GITHUB_WORKSPACE/halium-artifacts/System.map" 2>/dev/null || \
          cp "$GITHUB_WORKSPACE/kernel_src_halium/System.map" \
             "$GITHUB_WORKSPACE/halium-artifacts/System.map" 2>/dev/null || \
            echo "[WARN] System.map not found — skipping."

          # Optional: dtbo.img
          if [ -f "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/dtbo.img" ]; then
            cp "$GITHUB_WORKSPACE/kernel_src_halium/out/arch/arm64/boot/dtbo.img" \
               "$GITHUB_WORKSPACE/halium-artifacts/dtbo.img"
            echo "dtbo.img included."
          fi

          # Audit: .config for transparency & reproducibility
          cp "$GITHUB_WORKSPACE/kernel_src_halium/out/.config" \
             "$GITHUB_WORKSPACE/halium-artifacts/halium_tb311fu.config"

          # Final .config assertions before release
          grep "CONFIG_SECURITY_APPARMOR=y" "$GITHUB_WORKSPACE/halium-artifacts/halium_tb311fu.config" || \
            { echo "FATAL: CONFIG_SECURITY_APPARMOR=y absent from released .config!"; exit 1; }
          grep "CONFIG_RFKILL=m" "$GITHUB_WORKSPACE/halium-artifacts/halium_tb311fu.config" || \
            { echo "FATAL: CONFIG_RFKILL=m absent from released .config!"; exit 1; }

          cd "$GITHUB_WORKSPACE/halium-artifacts"
          sha256sum * > SHA256SUMS.txt
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          ls -la

      - name: Upload Halium Kernel Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: halium-kernel-artifacts-${{ steps.halium_package.outputs.TIMESTAMP }}
          path: halium-artifacts/*

      - name: Create Halium Kernel GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.halium_package.outcome == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('halium-kernel-{0}', steps.halium_package.outputs.TIMESTAMP) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Halium Kernel Release {0}', github.ref_name) || format('Halium Kernel for Ubuntu Touch — Lenovo Tab with Clear Case (TB311FU) [{0}]', steps.halium_package.outputs.TIMESTAMP) }}
          body: |
            # 🐧 Halium Ubuntu Touch Kernel for Lenovo Tab with Clear Case (TB311FU)

            GKI Linux 6.6 kernel built with `halium_tb311fu_defconfig` for Ubuntu Touch / UBports deployment.
            Compiled with upstream LLVM toolchain (pinned 20261118).

            ---

            ### Artifacts
            | File | Description |
            |------|-------------|
            | `Image.gz` | Compressed kernel binary |
            | `Image.gz-dtb` | Compressed kernel with appended DTBs |
            | `dtbo.img` | Device Tree Blob Overlay (if produced) |
            | `System.map` | Kernel symbol map for crash debugging |
            | `halium_tb311fu.config` | Full kernel `.config` for audit and reproducibility |
            | `SHA256SUMS.txt` | SHA-256 checksums for all artifacts |

            ### Security Configuration
            - **AppArmor:** `CONFIG_SECURITY_APPARMOR=y` ✅ (required for Ubuntu Touch click confinement)
            - **Wi-Fi (RFKILL):** `CONFIG_RFKILL=m` ✅ (preserves stock modules.dep compatibility)
            - **KernelSU:** Disabled ✅ (Ubuntu Touch uses AppArmor, not root hooks)
            - **ThinLTO:** Enabled for memory-efficient linking
          draft: false
          prerelease: false
          files: halium-artifacts/*
